services:
  necesse:
    image: ghcr.io/stargumbo/necesse-server:${IMAGE_TAG:-latest}
    container_name: necesse
    restart: unless-stopped

    # Give the server time to save the world on shutdown (see README: graceful stop).
    stop_grace_period: 60s

    # Port mapping - UDP 14159 is the default Necesse port
    ports:
      - "${SERVER_PORT:-14159}:14159/udp"

    # Environment variables for server configuration
    # All variables are loaded from .env file
    environment:
      # Basic settings
      - SERVER_PORT=${SERVER_PORT:-14159}
      - WORLD_NAME=${WORLD_NAME:-MyWorld}

      # Server parameters
      - SERVER_PASSWORD=\n      # Or read it from a Docker secret instead (wins over SERVER_PASSWORD); see README: Secrets.
      # - SERVER_PASSWORD_FILE=/run/secrets/necesse_password
      - SERVER_SLOTS=${SERVER_SLOTS}
      - SERVER_OWNER=${SERVER_OWNER}
      - SERVER_MOTD=${SERVER_MOTD}

      # Gameplay settings
      - PAUSE_WHEN_EMPTY=${PAUSE_WHEN_EMPTY}
      - GIVE_CLIENTS_POWER=${GIVE_CLIENTS_POWER}

      # Advanced settings
      - ENABLE_LOGGING=${ENABLE_LOGGING}
      - ZIP_SAVES=${ZIP_SAVES}
      - SERVER_LANGUAGE=${SERVER_LANGUAGE}
      - SETTINGS_FILE=${SETTINGS_FILE}
      - BIND_IP=${BIND_IP}
      - MAX_CLIENT_LATENCY=${MAX_CLIENT_LATENCY}
      - LOCAL_DIR=${LOCAL_DIR:-0}
      - DATA_DIR=${DATA_DIR}
      - LOGS_DIR=${LOGS_DIR}
      - UPDATE_ON_START=${UPDATE_ON_START}
      - AUTO_UPDATE_INTERVAL_MINUTES=${AUTO_UPDATE_INTERVAL_MINUTES:-0}
      - JAVA_OPTS=${JAVA_OPTS}

      # Steam Workshop mods (see README: Workshop mods)
      - MODS_WORKSHOP=${MODS_WORKSHOP}
      - MODS_FAIL_FAST=${MODS_FAIL_FAST:-true}
      - PUID=${PUID}
      - PGID=${PGID}

    # Persistent storage for world saves, configs, and logs: one bind mount.
    volumes:
      - ./data:/home/necesse/.config/Necesse

    # Resource limits (optional, adjust as needed)
    mem_limit: 2g
    mem_reservation: 512m

    # Uncomment together with SERVER_PASSWORD_FILE above to feed the password from a file.
    # secrets:
    #   - necesse_password

# secrets:
#   necesse_password:
#     file: ./necesse_password.txt   # one line; keep it out of git
