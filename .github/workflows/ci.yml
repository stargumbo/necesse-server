name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck the shell scripts
        run: shellcheck entrypoint.sh redact.sh console.sh scripts/fetch-depotdownloader.sh tests/run-fixtures.sh tests/run-platform.sh

      - name: Byte-compile the Python helpers
        run: python3 -m py_compile scripts/game-version.py

      - name: Docker build
        run: docker build --pull -t necesse-server:ci .

      # publish.yml derives the game-version tags from Server.jar inside the pushed image. Catch a change in the
      # game's class layout here, on every push, instead of at the next release.
      - name: Game version is detectable in the built image
        run: |
          set -euo pipefail
          cid="$(docker create necesse-server:ci)"
          docker cp "${cid}:/app/Server.jar" ./Server.jar
          docker rm "${cid}" >/dev/null
          game="$(python3 scripts/game-version.py ./Server.jar)"
          sha256sum ./Server.jar
          rm -f ./Server.jar
          echo "Game version in the built image: ${game}"

      # The same suite arm64.yml runs on the arm64 runner: boot, console, password path, healthcheck,
      # UPDATE_ON_START, auto-update restart, Workshop mods and the console stop, all through DepotDownloader.
      - name: Platform checks on amd64
        run: IMAGE=necesse-server:ci tests/run-platform.sh

      - name: Container logs (on failure)
        if: failure()
        run: |
          for c in $(docker ps -a --filter name=npf- --format '{{.Names}}'); do
            echo "::group::${c}"; docker logs "${c}" 2>&1 | tail -n 200; echo "::endgroup::"
          done

      - name: Clean up
        if: always()
        run: IMAGE=necesse-server:ci tests/run-platform.sh clean || true

  # publish.yml builds linux/amd64 and linux/arm64 from one amd64 runner: the game files are fetched natively
  # (the fetch stages run on the build platform) and only the arm64 runtime stage's apt-get runs under QEMU.
  # Build that exact multi-platform path on every push so a release never discovers it broken.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build linux/amd64 and linux/arm64 (no push)
        run: |
          set -euo pipefail
          docker buildx build --pull --platform linux/amd64,linux/arm64 --output type=cacheonly \
            --build-arg BUILD_VERSION=ci --build-arg BUILD_REVISION="${GITHUB_SHA}" .
